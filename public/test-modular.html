<body>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
    "firebase/messaging": "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js"
  }
}
</script>
<script type="module">
  import { initializeApp } from 'firebase/app';
  import { getMessaging, getToken } from 'firebase/messaging';

  const firebaseConfig = {
    apiKey: "AIzaSyAeAse7523kJjaEDkOk2_2TS82b35FsLdU",
    authDomain: "restaurant-d8c26.firebaseapp.com",
    projectId: "restaurant-d8c26",
    storageBucket: "restaurant-d8c26.appspot.com",
    messagingSenderId: "737042296898",
    appId: "1:737042296898:web:a855275efb86d910fbbddb"
  };

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  async function requestToken() {
    try {
      // Register service worker with explicit scope
      const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', {
        scope: '/'
      });
      console.log('SW registered:', registration);

      // Wait for activation
      await navigator.serviceWorker.ready;
      console.log('SW ready');

      // Request permission
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        console.warn('Permission denied');
        return;
      }

      // Get token
      const token = await getToken(messaging, {
        vapidKey: 'BE1440MIYb76_xV4aAtzDkD3-W0XwlBQDWaCuRcPeyTfR80rbBv8rUkoRgKQVFl9IGBAK18avKYdEE3-SHvhrG4',
        serviceWorkerRegistration: registration
      });
      console.log('✅ Token:', token);
    } catch (err) {
      console.error('❌ Error:', err);
    }
  }

  requestToken();
</script>
</body>
